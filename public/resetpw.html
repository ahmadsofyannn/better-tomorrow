<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Better Tomorrow</title>
  <link rel="stylesheet" href="/css/resetpw.css">
</head>
<body>

  <div class="card">
    <h2>Reset Password</h2>
    <p class="subtitle">Masukkan email, kode OTP dari inbox, serta password baru Anda.</p>

    <div class="form-group">
      <label>Email Terdaftar</label>
      <input type="email" id="email" placeholder="nama@email.com" required>
    </div>

    <div class="form-group">
      <label>Kode OTP (6 Angka)</label>
      <input type="text" id="otp" placeholder="123456" maxlength="6" required>
    </div>

    <div class="form-group">
      <label>Password Baru</label>
      <input type="password" id="newPassword" placeholder="Masukkan password baru" required>
    </div>

    <button onclick="resetPassword()">Ubah Password</button>

    <div id="message" class="message"></div>
    <a href="/login.html" class="back-link">← Batal & Kembali ke Login</a>
  </div>

  <script src="/js/resetpw.js"></script>
</body>
</html>
