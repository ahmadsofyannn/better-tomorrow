<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Better Tomorrow</title>

  <!-- Typography & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Global & Page Stylesheet -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">

  <main class="auth-wrapper">
    
    <!-- KOLOM KIRI: FORM SIGN UP -->
    <section class="auth-card-form">
      <header class="auth-header">
        <h1>Sign up</h1>
      </header>

      <form id="signupForm" class="auth-form" action="/api/signup" method="POST">
        <div class="form-group-line">
          <input 
            type="text" 
            id="fullName" 
            name="fullName" 
            placeholder="Username" 
            required 
            autocomplete="name" 
          />
          <i class="fa-regular fa-user input-icon" aria-hidden="true"></i>
        </div>

        <div class="form-group-line">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Email" 
            required 
            autocomplete="email" 
          />
          <i class="fa-regular fa-envelope input-icon" aria-hidden="true"></i>
        </div>

        <div class="form-group-line">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Password" 
            minlength="8" 
            required 
            autocomplete="new-password" 
          />
          <i class="fa-solid fa-lock input-icon toggle-password" id="togglePassword" title="Lihat Password" aria-hidden="true"></i>
        </div>

        <button type="submit" class="btn-submit">Sign up</button>
      </form>

      <footer class="auth-links" style="justify-content: center;">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </footer>
    </section>

    <!-- KOLOM KANAN: BANNER VISUAL DENGAN GAMBAR OLAHRAGA -->
    

  </main>

  <!-- Global & Page JavaScript -->
  <script src="js/app.js"></script>
  <script src="js/register.js"></script>
  
</body>
</html>
