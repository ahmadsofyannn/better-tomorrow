<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Better Tomorrow</title>

  <!-- Typography & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Global & Page Stylesheet -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">

  <main class="auth-container">
    
    <!-- KOLOM KIRI: FORM LOGIN -->
    <section class="auth-card-form">
      <header class="auth-header">
        <a href="index.html" class="auth-logo"><i class="fa-solid fa-heart-pulse"></i></a>
        <h1>Selamat Datang Kembali!</h1>
        <p>Jaga konsistensi gaya hidup sehatmu setiap hari bersama Better Tomorrow.</p>
      </header>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan email Anda" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Masukkan password Anda" required />
            <i class="fa-regular fa-eye toggle-password" id="togglePassword" title="Lihat Password"></i>
          </div>
        </div>

        <div class="form-options">
          <a href="forgot-password.html" class="forgot-link">Lupa Password?</a>
        </div>

        <button type="submit" class="btn-primary">Masuk Sekarang</button>
      </form>

      <footer class="auth-footer-text">
        <p>Belum punya akun? <a href="register.html">Daftar Sekarang</a></p>
      </footer>
    </section>

    <!-- KOLOM KANAN: BANNER VISUAL -->
    <aside class="auth-card-banner">
      <div class="banner-content">
        <h2>Mulai Langkah Sehatmu Hari Ini</h2>
        <p>Pantau kebiasaan harian, hitung berat badan ideal, dan capai target kesehatanmu.</p>
      </div>
      <figure class="banner-image-wrapper">
        <img src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=800&auto=format&fit=crop" alt="Ilustrasi Orang Berolahraga dan Lari Sehat" class="banner-img" />
      </figure>
    </aside>

  </main>

  <!-- Global & Page JavaScript -->
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
  
</body>
</html>
