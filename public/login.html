<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Better Tomorrow</title>

  <!-- Typography & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Global & Page Stylesheet -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">

  <main class="auth-wrapper">
    
    <!-- KOLOM KIRI: BANNER VISUAL DENGAN GAMBAR OLAHRAGA -->
    

    <!-- KOLOM KANAN: FORM LOGIN -->
    <section class="auth-card-form form-right">
      <header class="auth-header">
        <h1>Login</h1>
      </header>

      <form id="loginForm" class="auth-form" action="/api/login" method="POST">
        <div class="form-group-line">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Email" 
            required 
            autocomplete="email" 
          />
          <i class="fa-regular fa-envelope input-icon" aria-hidden="true"></i>
        </div>

        <div class="form-group-line">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Password" 
            required 
            autocomplete="current-password" 
          />
          <i class="fa-solid fa-lock input-icon toggle-password" id="togglePassword" title="Lihat Password" aria-hidden="true"></i>
        </div>

        <button type="submit" class="btn-submit">Login</button>
      </form>

      <footer class="auth-links">
        <a href="register.html">Create an account</a>
        <a href="forgotpw.html">Forgot password?</a>
      </footer>
    </section>

  </main>

  <!-- Global & Page JavaScript -->
  <script src="js/login.js"></script>
  
</body>
</html>
