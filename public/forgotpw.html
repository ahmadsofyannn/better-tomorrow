<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Better Tomorrow</title>

  <!-- Typography & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Global & Page Stylesheet -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">

  <main class="auth-wrapper">
    
    <!-- KOLOM KIRI: BANNER VISUAL DENGAN GAMBAR OLAHRAGA -->
  

    <!-- KOLOM KANAN: FORM FORGOT PASSWORD -->
    <section class="auth-card-form form-right">
      <header class="auth-header">
        <h1>Forgot Password</h1>
      </header>

      <form id="forgotPasswordForm" class="auth-form" action="/api/forgot-password" method="POST">
        <div class="form-group-line">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your registered email" 
            required 
            autocomplete="email" 
          />
          <i class="fa-regular fa-envelope input-icon" aria-hidden="true"></i>
        </div>

        <button type="submit" class="btn-submit">Send Reset Link</button>
      </form>

      <footer class="auth-links" style="justify-content: center;">
        <a href="login.html">Back to Login</a>
      </footer>
    </section>

  </main>

  <!-- Global & Page JavaScript -->
  <script src="js/app.js"></script>
  <script src="js/forgotpw.js"></script>
  
</body>
</html>
